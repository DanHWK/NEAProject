{% extends 'base.html' %}
<!doctype html>
{% block body %}
<h1> Fitness </h1>
<br>
<h2> Add exercise session </h2>
<br>
<br>
<form method="POST">
  <h4> Duration of exercise </h4>

  <div class="form-group">
    <label for="exercisedurationhours">Hours</label>
    <select type="integer" class="form-control form-control-sm" id="exercisedurationhours" placeholder="Enter duration of session" name = "exercise_hours" required>
      {% for x in range(0,11) %}
        <option>{{x}}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label for="exercisedurationminutes">Minutes</label>
    <select type="integer" multiple class="form-control form-control-sm" id="exercisedurationminutes" placeholder="Enter duration of session" name = "exercise_minutes" required>
      {% for x in range(0,60) %}
        <option>{{x}}</option>
      {% endfor %}
    </select>
  </div>

  <br>

  <div class="form-group">
    <label for="exercisename">Name of activity</label>
    <input type="text" class="form-control" id="exercisename" placeholder="Name of the activty" name = "exercise_name" required>
  </div>

  <button type="submit" class="btn btn-success">Submit</button>
</form>
<br>
<br>
{% if success == True %}
  <div class="alert alert-success" role="alert">
    Exercise Record successfully recorded
  </div>
{% endif %}

{% endblock %}

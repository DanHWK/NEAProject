{% extends 'base.html' %}
<!doctype html>
{% block body %}

{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="alert alert-danger">
    {{ messages[0] }}.
</div>
{% endif %}
{% endwith %}

<h3>Forgot Password</h3>
<p><small>An email will be sent containing __ </small></p>
<form method = "POST">
  <h5> Email address </h5>
  <div class="field">
      <div class="control">
          <input class="input is-large" type="email" name="forgotten_user_email" placeholder="Enter your email" autofocus="" required>
      </div>
  </div>

  <br>
  <button class="button is-block is-info is-large is-fullwidth">Submit</button>
</form>

{% endblock %}

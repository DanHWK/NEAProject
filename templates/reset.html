{% extends 'base.html' %}
<!doctype html>
{% block body %}
{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="alert alert-danger">
    {{ messages[0] }}.
</div>
{% endif %}

{% endwith %}
<h1> Confirm reset password </h1>

<br>
<form method = "POST">
  <h5> Token </h5>
  <div class="field">
      <div class="control">
          <input class="input is-large" type="string" name="user_token" placeholder="Enter your token" autofocus="" required>
      </div>
  </div>

  <br>

  <h5> Email address </h5>
  <div class="field">
      <div class="control">
          <input class="input is-large" type="email" name="repeat_user_email" placeholder="Enter your email again" autofocus="" required>
      </div>
  </div>
  <br>
  <button class="button is-block is-info is-large is-fullwidth">Submit</button>
</form>








{% endblock %}
